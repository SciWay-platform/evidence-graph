version: 2
updates:
  # The library has no runtime dependencies, so the supply-chain surface that actually exists is
  # the CI workflows. A stale pinned action is the realistic risk here, not a stale package.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
